# Vérifications à chaque poussée et demande de fusion (dépôt public : minutes gratuites, sans quota) : types et tests
# (sans modèles) sous Linux et Windows avec Node 24, la version minimale, et sous macOS, la plateforme d'usage, avec Node 26 ;
# gitleaks ; garde de publication (liste blanche, secrets, chemins personnels ; sans termes interdits, qui restent sur la
# machine de l'auteur : mode non strict).
name: verifier
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.os == 'macos-latest' && 26 || 24 }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dossier de modèles vide et existant : aucun test ne charge de modèle (le contexte `runner` n'existe qu'au niveau des étapes).
      - run: |
          node -e "const d = require('node:path').join(process.env.RUNNER_TEMP, 'mnemo-modeles-vides'); require('node:fs').mkdirSync(d, { recursive: true }); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'MNEMO_MODELES=' + d + String.fromCharCode(10))"
      - run: pnpm verifier
      - run: pnpm test
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
      # Sans installation : le script n'utilise que Node et git.
      - run: pnpm verifier-publication
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # gitleaks, épinglé par SHA (v2.3.9), version du moteur fixée (la syntaxe `[[allowlists]]` de .gitleaks.toml
      # demande gitleaks ≥ 8.25) ; règles par défaut et faux positifs admis : .gitleaks.toml.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.28.0
