# Types et tests (sans modèles) à chaque poussée et demande de fusion qui touche autre chose que la documentation : sous
# Linux et Windows avec Node 24, la version minimale, et sous macOS, la plateforme d'usage, avec Node 26. Une modification
# de documentation seule (Markdown, images) ne les lance pas ; la garde (garde.yml) tourne toujours.
name: verifier
on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Windows en cours d'adaptation : son job renseigne sans bloquer (une dizaine d'échecs au premier essai, 24/11/2026).
    continue-on-error: ${{ matrix.os == 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.os == 'macos-latest' && 26 || 24 }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Dossier de modèles vide et existant : aucun test ne charge de modèle (le contexte `runner` n'existe qu'au niveau des étapes).
      - run: |
          node -e "const d = require('node:path').join(process.env.RUNNER_TEMP, 'mnemo-modeles-vides'); require('node:fs').mkdirSync(d, { recursive: true }); require('node:fs').appendFileSync(process.env.GITHUB_ENV, 'MNEMO_MODELES=' + d + String.fromCharCode(10))"
      - run: pnpm verifier
      # L'app de bureau (packages/app) est pour macOS seulement : ses tests ne tournent que là.
      - run: pnpm test
        if: matrix.os == 'macos-latest'
      - run: pnpm -r --workspace-concurrency=1 --no-bail --filter "!@mnemo/app" test
        if: matrix.os != 'macos-latest'
      - run: pnpm exec vitest run --config outils/vitest.config.ts
        if: matrix.os != 'macos-latest'
