# Banc d'essai de Mnemo : questions posées à la mémoire fictive de banc/corpus/ (jamais tirée de données réelles).
#
# Section `recherche` : chaque question porte
#   question  le texte posé, tel qu'un utilisateur l'écrirait ;
#   genre     mots (mots de la réponse), paraphrase (aucun mot commun avec la réponse, après la normalisation de la
#             recherche plein texte : vérifié par tests/application/banc.test.ts), graphe (réponse dans une fiche liée à
#             la fiche évidente), texte-libre (réponse seulement dans une section libre d'une fiche), long-texte
#             (réponse au milieu d'un document de plus de 20 000 caractères), flexion (la réponse n'a qu'une autre forme
#             du mot de la question : « déployer » / « déploiement »), contexte (la réponse n'a son sujet que dans le
#             contexte de sa fiche ou de son document : synthèse, premières lignes) ;
#   attendus  ids d'éléments (`fiche.md#^f-0001`, passage de fiche `fiche.md#section`) ou chemins de fiche (`fiche.md` :
#             tout élément ou passage de la fiche) ;
#   position  (facultatif) position de la session, relative à _mnemo/, pour la variante « + position » ;
#   perimetre (facultatif) dossier où chercher, relatif à _mnemo/ ;
#   unSeulDe  (facultatif) chemins de fiche dont un seul au plus doit figurer dans les 10 premiers résultats (copies).
# Genres de la note unique : saturation (le bon fait, observé à 51 %, porte les mots exacts ; trois faits déclarés à 100 %
# de la même fiche n'en portent aucun : ils ne doivent pas le devancer) ; doublons (la règle citée doit être dans les 3
# premiers, et une seule des trois copies importées de sa source dans les 10 premiers).
# Les sections de l'archiviste (extraction, contradictions, consignes) suivent la section `recherche`.

