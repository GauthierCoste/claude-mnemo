consignes:
  # Vérifiées : rejouées par la vérification du hook `outil` (racine /banc, dossier courant /banc/code/heron)
  - consigne: Ne jamais pousser en force sur un dépôt git.
    regle: { type: commandes_interdites, motifs: ["git push *--force*", "git push -f*", "git push * -f*"] }
    action: { nom: Bash, entree: { command: "git push --force origin main" } }
    attendu: refus
  - consigne: Ne jamais pousser en force sur un dépôt git.
    action: { nom: Bash, entree: { command: "git push -f" } }
    attendu: refus
  - consigne: Ne jamais pousser en force sur un dépôt git.
    action: { nom: Bash, entree: { command: "git push origin main --force-with-lease" } }
    attendu: refus
  - consigne: Ne jamais pousser en force sur un dépôt git.
    action: { nom: Bash, entree: { command: "composer test && git push --force" } }
    attendu: refus
  - consigne: Ne jamais pousser en force sur un dépôt git.
    action: { nom: Bash, entree: { command: "sudo git push --force" } }
    attendu: refus
  - consigne: Ne jamais pousser en force sur un dépôt git.
    action: { nom: Bash, entree: { command: "git push origin feature-fix" } }
    attendu: permis
  # Limite connue : la vérification est un rappel ferme, pas une sécurité ; `env` n'est pas retiré en tête de commande.
  - consigne: Ne jamais pousser en force sur un dépôt git.
    action: { nom: Bash, entree: { command: "env git push --force" } }
    attendu: refus
  - consigne: Ne pas toucher au dossier vendor/.
    regle: { type: chemins_interdits, motifs: ["**/vendor/**"] }
    action: { nom: Write, entree: { file_path: /banc/code/heron/vendor/autoload.php, content: "" } }
    attendu: refus
  - consigne: Ne pas toucher au dossier vendor/.
    action: { nom: Edit, entree: { file_path: /banc/code/heron/src/Kernel.php, old_string: a, new_string: b } }
    attendu: permis
  - consigne: Ne pas toucher au dossier vendor/.
    action: { nom: MultiEdit, entree: { file_path: vendor/sylius/sylius/composer.json, edits: [] } }
    attendu: refus
  - consigne: Ne jamais modifier les fichiers .env.
    regle: { type: chemins_interdits, motifs: ["**/.env", "**/.env.*"] }
    action: { nom: Edit, entree: { file_path: /banc/code/heron/.env, old_string: a, new_string: b } }
    attendu: refus
  - consigne: Ne jamais modifier les fichiers .env.
    action: { nom: Write, entree: { file_path: /banc/code/heron/.env.local, content: "" } }
    attendu: refus
  - consigne: Ne jamais lancer de migration de base de données sans mon accord.
    regle: { type: commandes_interdites, motifs: ["php bin/console doctrine:migrations:migrate*", "bin/console doctrine:migrations:migrate*"] }
    action: { nom: Bash, entree: { command: "php bin/console doctrine:migrations:migrate --no-interaction" } }
    attendu: refus
  - consigne: Ne jamais lancer de migration de base de données sans mon accord.
    action: { nom: Bash, entree: { command: "php bin/console doctrine:migrations:status" } }
