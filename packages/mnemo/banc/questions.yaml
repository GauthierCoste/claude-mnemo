# --- Bancs de l'archiviste (corpus fictif banc/corpus-archiviste/, écrit pour le banc) ---
#
# Section `extraction` : documents de corpus-archiviste/extraction/documents/, copiés dans documents/ d'une mémoire neuve.
#   faits      les 50 faits attendus : `document` (chemin relatif à la racine du dossier), `termes` (mots ou valeurs
#              obligatoires : un fait les contient tous, comparés sans accents, sans casse, sans espaces ni ponctuation,
#              dates ramenées à AAAA-MM-JJ), `citation` (le passage exact du document qui le porte).
#   decisions  les 20 décisions clés, mesurées par la couverture : `document`, `termes`.
# Section `contradictions` : mémoire de corpus-archiviste/contradictions/memoire/ (copiée dans _mnemo/), documents de
#   corpus-archiviste/contradictions/documents/. Chaque paire : `ancien` (texte d'un fait de la mémoire de départ),
#   `nouveau` (valeur qui distingue le fait nouveau), `attendu` : `remplace` (l'ancien est barré, un fait vivant de la
#   même fiche porte la valeur nouvelle) ou `a_confirmer` (l'ancien reste, un fait à confirmer de la même fiche le contredit).
# Section `consignes` : chaque cas porte `consigne` (texte, portée globale), et `regle` + `action` + `attendu` (refus ou
#   permis, rejoué par la vérification du hook `outil`) et/ou `message` (le message d'utilisateur doit servir la consigne).
#   Une consigne avec règle est posée au niveau `verifiee`, sans règle au niveau `rappelee`. Racine fictive : /banc.

